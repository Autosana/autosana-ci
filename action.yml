name: "Autosana CI Upload"
description: "Upload your mobile app or Chrome extension, or register a web app URL with Autosana"
inputs:
  api-key:
    description: "Your Autosana API key"
    required: true
  platform:
    description: "Platform: android, ios, web, or chrome-extension"
    required: true

  # Mobile / extension inputs (required when platform is android, ios, or chrome-extension)
  bundle-id:
    description: "[Mobile/Extension] Your app's bundle ID, or a stable identifier for your extension (e.g. 'my-extension')"
    required: false
  build-path:
    description: "[Mobile/Extension] Full path to the build artifact. Android: .apk or .aab. iOS: .ipa or a zipped .app bundle. Chrome extension: .zip of the unpacked Manifest V3 extension directory."
    required: false
  enable-ios-keychain-access-group-remapping:
    description: "[iOS] Persist whether .ipa builds should remap Team-ID-prefixed keychain access groups after cloud re-signing. Omit to use the app's saved preference."
    required: false
  physical-device:
    description: "[Single-device mobile runs] Run on real hardware. Defaults to false."
    required: false
    default: "false"
  device-model:
    description: "[Single-device mobile runs] Model from the Autosana device catalog (for example, 'Pixel 10 Pro'). 'latest' is normalized to rolling model selection."
    required: false
  os-version:
    description: "[Single-device mobile runs] OS version supported by the selected device model (for example, '17'). 'latest' is normalized to rolling OS selection."
    required: false
  devices:
    description: "[Multi-device mobile runs] JSON array of ordered device selections. Two-device flows currently require exactly two objects with physical, model, and os_version fields as needed."
    required: false

  # Web-specific inputs (required when platform is web)
  app-id:
    description: "[Web] Unique identifier for your web app (lowercase, alphanumeric with hyphens, e.g., 'my-web-app')"
    required: false
  url:
    description: "[Web] URL to test (e.g., Vercel/Netlify preview deployment URL)"
    required: false

  # Shared optional inputs
  commit-sha:
    description: "Full 40-character commit SHA for this build and selected tests. Overrides PR event and checkout metadata without changing the checkout."
    required: false
  branch-name:
    description: "Branch associated with this build. Defaults to GitHub's head branch or ref name."
    required: false
  repo-full-name:
    description: "Repository associated with this build and selected tests (owner/repo). Defaults to GITHUB_REPOSITORY; must match it when selectors are present."
    required: false
  name:
    description: "Display name for your app (optional, will update if app already exists)"
    required: false
  environment:
    description: "Environment name to associate this app with (e.g., 'staging', 'production'). Apps with the same identifier (bundle ID for mobile, app-id for web) but different environments are treated as separate apps. Chrome extensions are organization-wide and ignore this input."
    required: false

  api-url:
    description: "API base URL (for testing with dev/staging). Default: https://backend.autosana.ai"
    required: false
    default: "https://backend.autosana.ai"

  # Build variables (optional - passed to flow instructions via ${env:KEY})
  variables:
    description: "Key-value variables to pass to flow instructions (format: KEY1=VALUE1,KEY2=VALUE2)"
    required: false

  # Flow execution inputs (optional for web/mobile; unsupported for chrome-extension uploads)
  suite-ids:
    description: "Comma-separated suite UUIDs to run (e.g., 'uuid1,uuid2'). Not supported for Chrome extension uploads; trigger extension tests from a separate web Action step."
    required: false
  flow-ids:
    description: "Comma-separated flow UUIDs to run (e.g., 'uuid1,uuid2'). Not supported for Chrome extension uploads; trigger extension tests from a separate web Action step."
    required: false
  suite-keys:
    description: "Comma-separated code-managed suite keys to run from the resolved commit (commit-sha when provided). Can be combined with flow-keys, but not with ID or label selectors. Not supported for Chrome extension uploads."
    required: false
  flow-keys:
    description: "Comma-separated code-managed flow keys to run from the resolved commit (commit-sha when provided). Can be combined with suite-keys, but not with ID or label selectors. Not supported for Chrome extension uploads."
    required: false
  labels:
    description: "Comma-separated label names to run (e.g., 'smoke,regression'). Runs the union of all suites and flows carrying any of these labels. Combine with suite-ids/flow-ids to add to the selection. Not supported for Chrome extension uploads; trigger extension tests from a separate web Action step."
    required: false
  web-browser:
    description: "[Web] Playwright engine to run on: chrome (default, real Google Chrome with proprietary codecs / DRM), chromium (bundled engine, no codecs / DRM), firefox, or edge. Ignored for mobile platforms. Aliases accepted: msedge -> edge."
    required: false
  dependencies:
    description: "[Web runs only] JSON array overriding the app's default extension loadout for this run. Omit to inherit defaults; use [] for none; entries may be app UUID strings or {\"app_id\":\"...\",\"app_build_id\":\"...\"} pins. Not supported with suite-keys, mobile, or Chrome extension uploads."
    required: false
  wait:
    description: "Wait for triggered flows to finish and gate the job on their result (default: true). Set to 'false' to trigger the flows, print their run links, and exit immediately without blocking CI. Applies when an ID, key, or label selector triggers tests."
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - run: chmod +x ${{ github.action_path }}/entrypoint.sh
      shell: bash
    - run: ${{ github.action_path }}/entrypoint.sh
      shell: bash
      env:
        AUTOSANA_KEY: ${{ inputs.api-key }}
        PLATFORM: ${{ inputs.platform }}
        # Mobile inputs
        BUNDLE_ID: ${{ inputs.bundle-id }}
        BUILD_PATH: ${{ inputs.build-path }}
        ENABLE_IOS_KEYCHAIN_ACCESS_GROUP_REMAPPING: ${{ inputs.enable-ios-keychain-access-group-remapping }}
        PHYSICAL_DEVICE: ${{ inputs.physical-device }}
        DEVICE_MODEL: ${{ inputs.device-model }}
        OS_VERSION: ${{ inputs.os-version }}
        DEVICES: ${{ inputs.devices }}
        # Web inputs
        APP_ID: ${{ inputs.app-id }}
        URL: ${{ inputs.url }}
        # Shared
        AUTOSANA_COMMIT_SHA: ${{ inputs.commit-sha }}
        AUTOSANA_BRANCH_NAME: ${{ inputs.branch-name }}
        AUTOSANA_REPO_FULL_NAME: ${{ inputs.repo-full-name }}
        APP_NAME: ${{ inputs.name }}
        ENVIRONMENT: ${{ inputs.environment }}
        AUTOSANA_API_URL: ${{ inputs.api-url }}
        # Build variables
        VARIABLES: ${{ inputs.variables }}
        # Flow execution
        SUITE_IDS: ${{ inputs.suite-ids }}
        FLOW_IDS: ${{ inputs.flow-ids }}
        SUITE_KEYS: ${{ inputs.suite-keys }}
        FLOW_KEYS: ${{ inputs.flow-keys }}
        LABELS: ${{ inputs.labels }}
        WEB_BROWSER: ${{ inputs.web-browser }}
        DEPENDENCIES: ${{ inputs.dependencies }}
        WAIT: ${{ inputs.wait }}
