name: "Integration: Run Suites (Staging)"

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  run-suites:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The public test site sleeps when idle, and its first response can take
      # longer than a flow's page-load timeout. Wake it before running flows.
      - name: Wake the test site
        run: curl -sS -o /dev/null --retry 3 --retry-all-errors --max-time 60 https://the-internet.herokuapp.com/

      - name: Run test suites with Autosana (staging)
        uses: ./
        with:
          api-key: ${{ secrets.AUTOSANA_STAGING_KEY }}
          api-url: https://staging.autosana.ai
          platform: web
          name: The Internet
          app-id: the-internet
          url: https://the-internet.herokuapp.com/
          suite-ids: "c81f12c0-51ba-4d22-a0e7-4605a5110495,89588f4f-ec9a-4c16-8ea4-cc813404ef1d"
