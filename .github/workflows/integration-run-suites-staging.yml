name: "Integration: Run Suites (Staging)"

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  run-suites:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Smoke members span multiple suites. This verifies label selection keeps
      # each suite's setup, hooks, and session context at the pinned branch commit.
      - name: Run suite-backed branch labels with Autosana (staging)
        run: |
          GITHUB_REPOSITORY=Autosana/AutosanaDashboard \
          GITHUB_EVENT_PATH="$GITHUB_WORKSPACE/.github/fixtures/dashboard-smoke-pr-event.json" \
          bash ./entrypoint.sh
        env:
          AUTOSANA_KEY: ${{ secrets.AUTOSANA_STAGING_KEY }}
          AUTOSANA_API_URL: https://staging.autosana.ai
          PLATFORM: web
          APP_NAME: Autosana Dashboard (Preview)
          APP_ID: autosana-preview
          URL: https://app-tester-dashboard-kgm04awwx-autosana.vercel.app
          LABELS: smoke
          WAIT: "true"
