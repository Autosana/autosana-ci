name: "Integration: Run Suites (Staging)"

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  run-suites:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run test suites with Autosana (staging)
        uses: ./
        with:
          api-key: ${{ secrets.AUTOSANA_STAGING_KEY }}
          api-url: https://staging.autosana.ai
          platform: web
          name: The Internet
          app-id: the-internet
          # Flows load our own staging sign-in page. The public demo site used
          # before intermittently took 30 seconds to respond, which timed out
          # page launch and failed runs unrelated to the Action.
          url: https://dashboard.staging.autosana.ai/login
          suite-ids: "c81f12c0-51ba-4d22-a0e7-4605a5110495,89588f4f-ec9a-4c16-8ea4-cc813404ef1d"
