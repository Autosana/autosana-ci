name: "Integration: Run Flows (Staging)"

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  run-flows:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The action repository is not code-managed in Autosana. Run the entrypoint
      # against a pinned Dashboard PR fixture so this exercises branch labels and
      # waits for the selected suite-backed flows to finish.
      - name: Run branch-labeled flows with Autosana (staging)
        run: |
          GITHUB_REPOSITORY=Autosana/AutosanaDashboard \
          GITHUB_EVENT_PATH="$GITHUB_WORKSPACE/.github/fixtures/dashboard-smoke-pr-event.json" \
          bash ./entrypoint.sh
        env:
          AUTOSANA_KEY: ${{ secrets.AUTOSANA_STAGING_KEY }}
          AUTOSANA_API_URL: https://staging.autosana.ai
          PLATFORM: web
          APP_NAME: Autosana Dashboard (Preview)
          APP_ID: autosana-preview
          URL: https://app-tester-dashboard-kgm04awwx-autosana.vercel.app
          LABELS: smoke
          WAIT: "true"
