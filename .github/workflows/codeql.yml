name: CodeQL

# Scans this repo's workflows and composite action with CodeQL's GitHub Actions queries.
# The staging ruleset requires these results on every PR.

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    - cron: "17 13 * * 1" # weekly, Monday 13:17 UTC, catches new queries on unchanged code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"
