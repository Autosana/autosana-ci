name: "Integration: Android Device Selection (Staging)"

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        shell: bash
        run: |
          set -euo pipefail
          APK_URL="https://jwvmttqclexlhnhfxuyq.supabase.co/storage/v1/object/public/test_app_builds/wikipedia.apk"
          curl --fail --location --silent --show-error "${APK_URL}" --output wikipedia.apk
          test -s wikipedia.apk

      # Run this manually after the matching backend changes are deployed to staging.
      - name: Run Wikipedia on Pixel 10 Pro / Android 17
        uses: ./
        with:
          api-key: ${{ secrets.AUTOSANA_STAGING_KEY }}
          api-url: https://staging.autosana.ai
          name: Wikipedia
          bundle-id: org.wikipedia
          platform: android
          build-path: wikipedia.apk
          flow-ids: 069c9578-7156-416c-acd3-9f21255cc5ce
          physical-device: false
          device-model: Pixel 10 Pro
          os-version: "17"
