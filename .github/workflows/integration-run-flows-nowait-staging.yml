name: "Integration: Run Flows No-Wait (Staging)"

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  run-flows-nowait:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The tight timeout verifies that wait:false exits after dispatch instead
      # of polling until the staging flows finish.
      - name: Trigger flows without waiting (staging)
        timeout-minutes: 2
        uses: ./
        with:
          api-key: ${{ secrets.AUTOSANA_STAGING_KEY }}
          api-url: https://staging.autosana.ai
          platform: web
          name: The Internet
          app-id: the-internet
          url: https://the-internet.herokuapp.com/
          flow-ids: "9ae9c810-631f-472e-ba7d-9ca3b9f6820c,feeec631-bed1-43fe-ac16-ed65e4b9bd19"
          wait: false
