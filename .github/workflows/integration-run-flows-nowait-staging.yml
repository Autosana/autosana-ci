name: "Integration: Run Flows No-Wait (Staging)"

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  run-flows-nowait:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fire-and-forget: trigger branch-labeled flows and exit without polling.
      # The step should finish in seconds (just the trigger + initial link
      # fetch), not wait for the flows to run on Autosana. The tight timeout
      # is the assertion: if wait:false ever regresses to blocking, this step
      # would poll until the flows finish and blow past the limit.
      - name: Trigger branch-labeled flows without waiting (staging)
        id: trigger
        timeout-minutes: 2
        run: |
          GITHUB_REPOSITORY=Autosana/AutosanaDashboard \
          GITHUB_EVENT_PATH="$GITHUB_WORKSPACE/.github/fixtures/dashboard-smoke-pr-event.json" \
          bash ./entrypoint.sh
        env:
          AUTOSANA_KEY: ${{ secrets.AUTOSANA_STAGING_KEY }}
          AUTOSANA_API_URL: https://staging.autosana.ai
          PLATFORM: web
          APP_NAME: Autosana Dashboard (Preview)
          APP_ID: autosana-preview
          URL: https://app-tester-dashboard-kgm04awwx-autosana.vercel.app
          LABELS: smoke
          WAIT: "false"
