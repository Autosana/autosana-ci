name: "Integration: Branch Smoke (Staging)"

on:
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run branch-defined smoke flow
        uses: ./
        with:
          api-key: ${{ secrets.AUTOSANA_STAGING_KEY }}
          api-url: https://staging.autosana.ai
          platform: web
          name: Autosana CI Branch Smoke
          app-id: autosana-ci-branch-smoke
          url: https://the-internet.herokuapp.com/
          environment: staging
          labels: autosana-ci-smoke
          web-browser: chromium

      - name: Trigger branch-defined smoke flow without waiting
        if: always()
        timeout-minutes: 2
        uses: ./
        with:
          api-key: ${{ secrets.AUTOSANA_STAGING_KEY }}
          api-url: https://staging.autosana.ai
          platform: web
          name: Autosana CI Branch Smoke
          app-id: autosana-ci-branch-smoke
          url: https://the-internet.herokuapp.com/
          environment: staging
          labels: autosana-ci-smoke
          web-browser: chromium
          wait: false
