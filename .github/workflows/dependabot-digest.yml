name: Dependabot digest

# Every weekday, a few hours after Dependabot's 6am PT run (daily Dependabot runs skip
# weekends), posts this repo's Dependabot PRs that need a person to
# #pull-requests-for-review: majors (no auto-merge) and any with a failing check. PRs
# still waiting to auto-merge are skipped, since they merge on their own. A PR that stays
# open is posted again each weekday until it is handled, on purpose. Days with no such
# PRs post nothing.
on:
  schedule:
    - cron: "0 17 * * 1-5" # Weekdays, 10am PDT (9am PST)
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  actions: read # statusCheckRollup reads each check's workflow run; without it gh pr list fails

jobs:
  digest:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Post open Dependabot PRs to Slack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_PR_REVIEW_WEBHOOK }}
          REVIEWERS: "<@U08NR4GT37H>"
        run: |
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --author app/dependabot --state open \
            --json title,url,autoMergeRequest,statusCheckRollup \
            --jq '.[]
              | (any(.statusCheckRollup[]?; (.conclusion // .state) | IN("FAILURE", "ERROR", "TIMED_OUT", "CANCELLED", "STARTUP_FAILURE", "ACTION_REQUIRED"))) as $failing
              | select(.autoMergeRequest == null or $failing)
              | "• <\(.url)|\(.title)>" + (if $failing then " (CI failing)" else "" end)')
          if [ -z "$prs" ]; then
            echo "No open Dependabot PRs."
            exit 0
          fi
          text="$REVIEWERS Dependabot PRs ready to review (${GITHUB_REPOSITORY#*/})"$'\n'"$prs"
          jq -n --arg text "$text" '{text: $text}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
